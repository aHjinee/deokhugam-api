spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/deokhugam_test
    username: user1
    password: 1234

  data:
    mongodb:
      uri: mongodb://local:local1234@localhost:27017/deokhugam_test?authSource=admin

#  sql:
#    init:
#      mode: never
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 외부 API 키 더미 값
NAVER_CLIENT_ID: test-naver-client-id
NAVER_CLIENT_SECRET: test-naver-client-secret
GEMINI_API_KEY: test-gemini-api-key

logging:
  level:
    com.sbproject.deokhugam: debug
    org.hibernate.orm.jdbc.bind: trace
#    org.hibernate.SQL: debug

